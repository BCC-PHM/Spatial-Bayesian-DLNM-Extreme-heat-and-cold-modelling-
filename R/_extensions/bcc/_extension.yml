title: BCC
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    html:
      theme:
        - cosmo
        - bcc_quarto_theme.scss
      date-format: "DD MMM YYYY"
      toc: true
      toc-location: left
      number-sections: true
      code-fold: true
      embed-resources: true
      include-in-header:
        text: |
          <style>
          .csl-entry a {
            word-break: break-all;
            overflow-wrap: anywhere;
          }
          </style>
